name: CI

# Validate packaging and tests on every PR without consuming an npm version.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Build to dist/
        run: bun run build

      - name: Validate package (dry run — does NOT publish or consume a version)
        run: npm publish --dry-run --access public
