name: Release

# OIDC-based npm publish. Triggered by pushing a `v*` tag (e.g. v0.1.3).
# Publishing uses GitHub's OIDC token (id-token: write) — no NPM_TOKEN secret required,
# provided a Trusted Publisher is configured for this package in npm:
#   npm package settings → Trusted Publishers → add GitHub (repo: Chathula/opencode-vision-router).
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC / npm provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Run tests
        run: bun test

      - name: Publish to npm (OIDC provenance, no token needed)
        run: npm publish --provenance --access public
