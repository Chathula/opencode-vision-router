name: Release

# Publish to npm whenever a GitHub Release is published (tagged, e.g. v0.1.0).
on:
  release:
    types: [published]

# Provenance needs an OIDC token; publishing needs the npm token secret.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for npm publish + auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Bun (for install + tests)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag v$PKG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Publish to npm
        if: success()
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
